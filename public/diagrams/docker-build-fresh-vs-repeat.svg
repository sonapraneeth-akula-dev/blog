<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="canvas">
  <style>
    * { box-sizing: border-box; }
    .canvas {
      --ink: #17243d;
      --muted: #59697a;
      --blue: #4f7896;
      --amber: #b87016;
      --amber-bg: #fff7df;
      --green: #3f805c;
      --green-bg: #eaf5ee;
      --red: #a8544c;
      width: 1500px;
      height: 1000px;
      padding: 38px 46px 32px;
      overflow: hidden;
      color: var(--ink);
      background-color: #f7f8f5;
      background-image: radial-gradient(#ccd6db 1px, transparent 1px);
      background-size: 20px 20px;
      font-family: "Segoe UI", sans-serif;
    }
    h1, h2, h3, p { margin: 0; }
    .header { display: flex; align-items: end; justify-content: space-between; }
    .header h1 { font: 700 34px Georgia, serif; }
    .header p { margin-top: 7px; color: var(--muted); font-size: 15px; }
    .legend { display: flex; gap: 14px; color: var(--muted); font-size: 10px; font-weight: 800; }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .dot.run { background: var(--amber); }
    .dot.cached { background: var(--green); }
    .dot.store { border: 2px solid var(--green); background: #fff; }

    .source-flow { display: grid; grid-template-columns: 1fr 48px 1fr 48px 1.25fr; align-items: center; margin: 25px 0 18px; }
    .source-card { min-height: 74px; padding: 12px 14px; border: 2px solid var(--blue); border-radius: 8px; background: #fff; }
    .source-card.filter { border-style: dashed; border-color: var(--amber); background: var(--amber-bg); }
    .source-card.snapshot { border-color: var(--green); background: var(--green-bg); }
    .source-card strong { display: block; font-size: 12px; }
    .source-card code { display: block; margin-top: 5px; color: var(--green); font: 700 10px Consolas, monospace; }
    .source-card p { margin-top: 5px; color: var(--muted); font-size: 9px; line-height: 1.4; }
    .arrow { position: relative; height: 3px; margin: 0 7px; background: #33465f; }
    .arrow:after { content: ""; position: absolute; right: -1px; top: -6px; border-left: 10px solid #33465f; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }

    .vm { position: relative; height: 755px; padding: 42px 16px 15px; border: 3px solid var(--blue); border-radius: 13px; background: rgba(237,244,248,0.90); box-shadow: 0 8px 22px rgba(23,36,61,0.08); }
    .vm-label { position: absolute; top: -15px; left: 18px; padding: 6px 11px; border: 2px solid var(--blue); border-radius: 6px; background: #fff; color: #355b77; font-size: 10px; font-weight: 900; letter-spacing: 0.8px; text-transform: uppercase; }
    .buildkit { position: relative; height: 635px; padding: 42px 13px 13px; border: 2px dashed var(--amber); border-radius: 10px; background: rgba(255,247,223,0.88); }
    .buildkit-label { position: absolute; top: -14px; left: 15px; padding: 6px 10px; border: 2px dashed var(--amber); border-radius: 6px; background: #fff; color: #855714; font-size: 10px; font-weight: 900; letter-spacing: 0.8px; text-transform: uppercase; }
    .comparison { display: grid; grid-template-columns: 475px 365px 475px; gap: 16px; }
    .run-lane { position: relative; min-height: 552px; padding: 35px 11px 11px; border: 1px solid #d3b879; border-radius: 8px; background: #fff; }
    .run-lane.repeat { border-color: #89b39a; }
    .lane-label { position: absolute; top: -11px; left: 12px; padding: 5px 9px; border: 1px solid currentColor; border-radius: 4px; background: #fff; color: #855714; font-size: 9px; font-weight: 900; letter-spacing: 0.6px; text-transform: uppercase; }
    .repeat .lane-label { color: var(--green); }
    .step { display: grid; grid-template-columns: 34px 1fr 70px; gap: 9px; align-items: start; min-height: 105px; margin-bottom: 9px; padding: 10px; border: 1px solid #d9e0e4; border-radius: 7px; background: #f8faf9; }
    .step:last-child { margin-bottom: 0; }
    .number { display: grid; width: 29px; height: 29px; place-items: center; border-radius: 50%; background: var(--ink); color: #fff; font-size: 11px; font-weight: 900; }
    .step h3 { font: 700 14px Georgia, serif; }
    .step code { display: block; margin-top: 4px; color: var(--green); font: 700 9px Consolas, monospace; }
    .step p { margin-top: 5px; color: var(--muted); font-size: 8px; line-height: 1.45; }
    .status { padding: 5px 6px; border-radius: 4px; background: var(--amber); color: #fff; font-size: 8px; font-weight: 900; letter-spacing: 0.5px; text-align: center; }
    .status.cached { background: var(--green); }
    .io { margin-top: 6px; color: var(--red); font-size: 8px; font-weight: 800; text-align: right; }
    .io.read { color: var(--green); }

    .persistent { position: relative; min-height: 552px; padding: 35px 10px 10px; border: 2px solid var(--green); border-radius: 8px; background: var(--green-bg); }
    .persistent > .lane-label { color: var(--green); }
    .store { margin-bottom: 10px; padding: 10px; border-radius: 7px; background: #fff; }
    .store:last-child { margin-bottom: 0; }
    .store-head { display: flex; align-items: center; justify-content: space-between; }
    .store strong { font-size: 10px; }
    .store span { padding: 3px 5px; border-radius: 3px; background: #dcefe4; color: var(--green); font-size: 7px; font-weight: 900; }
    .store code { display: block; margin-top: 6px; color: var(--green); font: 700 9px Consolas, monospace; }
    .store p { margin-top: 5px; color: var(--muted); font-size: 8px; line-height: 1.4; }
    .not-runtime { margin-top: 11px; padding: 9px; border-radius: 6px; background: var(--ink); color: #fff; font-size: 8px; line-height: 1.45; text-align: center; }
    .store-arrows { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .store-arrows div { padding: 5px; border-radius: 4px; font-size: 7px; font-weight: 900; text-align: center; }
    .write { background: #f8e5e2; color: var(--red); }
    .read { background: #dcefe4; color: var(--green); }

    .image-store { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-top: 13px; }
    .image { display: flex; align-items: center; justify-content: space-between; padding: 11px 13px; border: 2px solid var(--green); border-radius: 7px; background: #fff; }
    .image strong { font-size: 10px; }
    .image p { margin-top: 3px; color: var(--muted); font-size: 8px; }
    .image code { color: var(--green); font: 700 8px Consolas, monospace; }
    .image-badge { padding: 5px 7px; border-radius: 4px; background: var(--green); color: #fff; font-size: 7px; font-weight: 900; }
    .footer { margin-top: 10px; color: var(--muted); font-size: 9px; text-align: center; }
  </style>

  <div class="header">
    <div><h1>Fresh build versus repeat MDX build</h1><p>The context is recreated each time; persistent BuildKit stores decide what work can be reused</p></div>
    <div class="legend"><span><i class="dot run"></i> command runs</span><span><i class="dot cached"></i> command skipped</span><span><i class="dot store"></i> persistent BuildKit state</span></div>
  </div>

  <div class="source-flow">
    <div class="source-card"><strong>Windows project directory</strong><code>content/ · src/ · package files</code><p>The source of every build context.</p></div>
    <div class="arrow"></div>
    <div class="source-card filter"><strong>.dockerignore filter</strong><code>exclude node_modules, dist, .git...</code><p>Runs before files cross into Docker.</p></div>
    <div class="arrow"></div>
    <div class="source-card snapshot"><strong>New per-build context snapshot</strong><code>allowed host files + metadata</code><p>BuildKit scans every build; known unchanged blobs need not be retransmitted.</p></div>
  </div>

  <section class="vm">
    <div class="vm-label">Docker Desktop Linux VM</div>
    <section class="buildkit">
      <div class="buildkit-label">BuildKit builder</div>
      <div class="comparison">
        <section class="run-lane fresh">
          <div class="lane-label">A · Fresh builder cache</div>
          <div class="step"><span class="number">1</span><div><h3>Load context</h3><code>scan + upload allowed blobs</code><p>No prior content is known, so BuildKit records the initial input blobs.</p></div><div><div class="status">RUN</div><div class="io">WRITE →</div></div></div>
          <div class="step"><span class="number">2</span><div><h3>Dependency stage</h3><code>bun install</code><p>Downloads packages and creates Linux /app/node_modules.</p></div><div><div class="status">RUN</div><div class="io">WRITE →</div></div></div>
          <div class="step"><span class="number">3</span><div><h3>Astro build stage</h3><code>astro build + Pagefind</code><p>Reads source, processes images, and generates dist.</p></div><div><div class="status">RUN</div><div class="io">WRITE →</div></div></div>
          <div class="step"><span class="number">4</span><div><h3>Export final image</h3><code>COPY --from=...</code><p>Creates the selected runtime image and stores its immutable layers.</p></div><div><div class="status">RUN</div></div></div>
        </section>

        <section class="persistent">
          <div class="lane-label">Persistent BuildKit stores</div>
          <div class="store"><div class="store-head"><strong>Context content store</strong><span>TRANSFER</span></div><code>known file blobs</code><p>Lets later builds send only new or changed content.</p><div class="store-arrows"><div class="write">FRESH WRITES</div><div class="read">REPEAT READS</div></div></div>
          <div class="store"><div class="store-head"><strong>Layer cache</strong><span>SKIP COMMAND</span></div><code>deps stage filesystem</code><p>Includes the builder's cached /app/node_modules result.</p><div class="store-arrows"><div class="write">FRESH WRITES</div><div class="read">REPEAT REUSES</div></div></div>
          <div class="store"><div class="store-head"><strong>Bun cache mount</strong><span>DOWNLOADS</span></div><code>/bun-cache</code><p>Helps only when bun install actually runs again.</p><div class="store-arrows"><div class="write">FRESH FILLS</div><div class="read">ON DEMAND</div></div></div>
          <div class="store"><div class="store-head"><strong>Astro cache mount</strong><span>DERIVED WORK</span></div><code>/app/node_modules/.astro</code><p>Reuses processed image artifacts when Astro reruns.</p><div class="store-arrows"><div class="write">FRESH FILLS</div><div class="read">REPEAT READS</div></div></div>
          <div class="not-runtime">Builder-private state: not automatically visible inside an image or running container.</div>
        </section>

        <section class="run-lane repeat">
          <div class="lane-label">B · Later build · one MDX changed</div>
          <div class="step"><span class="number">1</span><div><h3>Reload context</h3><code>rescan host project</code><p>The snapshot is recreated; only the changed MDX blob is new.</p></div><div><div class="status">RUN</div><div class="io read">← REUSE</div></div></div>
          <div class="step"><span class="number">2</span><div><h3>Dependency stage</h3><code>package inputs unchanged</code><p>Reuse the complete deps layer, including Linux node_modules.</p></div><div><div class="status cached">CACHED</div><div class="io read">← READ</div></div></div>
          <div class="step"><span class="number">3</span><div><h3>Astro build stage</h3><code>source input changed</code><p>Astro reruns, but its cache can avoid unchanged image work.</p></div><div><div class="status">RUN</div><div class="io read">← READ</div></div></div>
          <div class="step"><span class="number">4</span><div><h3>Export updated image</h3><code>reuse unchanged layers</code><p>Store new dist-related layers while retaining reusable base/deps layers.</p></div><div><div class="status">RUN</div></div></div>
        </section>
      </div>
    </section>

    <div class="image-store">
      <div class="image"><div><strong>Docker image store · first result</strong><p><code>base + deps + first dist</code></p></div><span class="image-badge">IMAGE A</span></div>
      <div class="image"><div><strong>Docker image store · updated result</strong><p><code>reused layers + new dist layers</code></p></div><span class="image-badge">IMAGE B</span></div>
    </div>
    <div class="footer">Cache hit means Docker skips the instruction · Cache mount means the instruction runs with reusable working data</div>
  </section>
</div>
  </foreignObject>
</svg>
